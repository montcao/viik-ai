name: Feature request
description: Suggest an idea or improvement for viik.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please [search existing issues](https://github.com/montcao/viik-ai/issues) first, and add a 👍 to an existing request instead of opening a duplicate.

        Saved resumes, creating a resume from scratch, and automatic applications are already planned.

        **This issue will be public.** Don't include your resume or personal details.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us what you were trying to do and what got in the way.
      placeholder: "When I look for jobs, I can't ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like viik to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
      description: Workarounds or other tools you use.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included my resume or any personal details in this issue.
          required: true
